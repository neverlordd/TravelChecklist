    <title>Наши путешествия</title>
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <script>
      (() => {
        const saved = localStorage.getItem('travel-theme')
        const dark = saved ? saved === 'dark' : window.Telegram?.WebApp?.colorScheme === 'dark' || window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0E0B16' : '#F6F5F9'
      })()
    </script>
